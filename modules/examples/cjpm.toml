[package]
name = "cactor_examples"
version = "1.2.1"
description = "示例程序"
cjc-version = "1.2.0"
output-type = "static"

[dependencies]
cactor_foundation = { path = "../foundation" }
cactor_core = { path = "../core" }
cactor_patterns = { path = "../patterns" }
cactor_runtime = { path = "../runtime" }
cactor = { path = "../cactor" }
cactor_macros = { path = "../macros" }
cactor_streams = { path = "../streams" }
cactor_persistence = { path = "../persistence" }
cactor_remote = { path = "../remote" }
cactor_cluster = { path = "../cluster" }
cactor_xstate = { path = "../xstate" }
cactor_testkit = { path = "../testkit" }
# 真实示例（ex01–ex05）需要对外 HTTP/SSE 能力：直接复用已实现的 Lou Web 框架，
# 不再自建 HTTP 门面（docs/plan/2026117-lz.md §2.1 的 G-1 由此解决）。
lou = { git = "https://gitcode.com/catorai/lou.git", tag = "v2.0.0" }

# examples 直接 import stdx（HTTP 客户端 / JSON）与 lou（依赖 stdx），单独构建时也要能找到 stdx 静态库
[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]

[target.aarch64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]

[target.aarch64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]

[target.x86_64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]

[package.package-configuration."cactor_examples.advanced_mailbox_examples"]
output-type = "executable"

