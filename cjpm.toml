[package]
name = "cactor"
version = "7.0.0"
description = "High-performance Actor system for Cangjie - CActor 7.0 with 6-layer architecture"
cjc-version = "0.60.5"
output-type = "dynamic"
compile-option = "-Woff unused -Woff parser --diagnostic-format=noColor"


