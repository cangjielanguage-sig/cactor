# CActor workspace —— 按仓颉 module（模块）划分的多模块工程
# 依赖方向（自底向上，无环）：
#   foundation -> core -> runtime -> patterns；runtime -> cactor(门面)
#   -> streams；remote / persistence -> cluster -> distribution(聚合) / xstate
#   -> integration -> tests / examples
#   macros 为独立宏模块，仅被 examples 使用
[workspace]
members = [
  "modules/foundation",
  "modules/core",
  "modules/patterns",
  "modules/runtime",
  "modules/cactor",
  "modules/testkit",
  "modules/macros",
  "modules/streams",
  "modules/remote",
  "modules/persistence",
  "modules/cluster",
  "modules/distribution",
  "modules/xstate",
  "modules/integration",
  "modules/tests",
  "modules/examples",
]
build-members = []
test-members = []
compile-option = "-O2 -Woff unused -Woff parser --diagnostic-format=noColor"
override-compile-option = ""
link-option = ""
target-dir = ""
