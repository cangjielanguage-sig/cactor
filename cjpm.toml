[package]
name = "cactor"
version = "7.0.0"
description = "High-performance Actor system for Cangjie - CActor 7.0 with 6-layer architecture"
cjc-version = "0.60.5"
output-type = "dynamic"
compile-option = "-Woff unused --diagnostic-format=noColor"

# 编译器选项 - 抑制未使用变量警告
[package.compiler-options]
cjc-flags = ["-Wno-unused"]

# === Foundation Layer ===
[package.package-configuration."cactor.foundation.memory"]
output-type = "static"

[package.package-configuration."cactor.foundation.queue"]
output-type = "static"

[package.package-configuration."cactor.foundation.serialization"]
output-type = "static"

[package.package-configuration."cactor.foundation.network"]
output-type = "static"

# === Core Layer ===
[package.package-configuration."cactor.core.actor"]
output-type = "static"

[package.package-configuration."cactor.core.message"]
output-type = "static"

[package.package-configuration."cactor.core.system"]
output-type = "static"

[package.package-configuration."cactor.core.supervision"]
output-type = "static"

[package.package-configuration."cactor.core.context"]
output-type = "static"

[package.package-configuration."cactor.core.config"]
output-type = "static"

# === Runtime Layer ===
[package.package-configuration."cactor.runtime.mailbox"]
output-type = "dynamic"

[package.package-configuration."cactor.runtime.dispatcher"]
output-type = "dynamic"

[package.package-configuration."cactor.runtime.scheduler"]
output-type = "dynamic"

[package.package-configuration."cactor.runtime.execution"]
output-type = "dynamic"

[package.package-configuration."cactor.runtime.system"]
output-type = "dynamic"

# === API Layer ===
[package.package-configuration."cactor.api"]
output-type = "static"

[package.package-configuration."cactor.api.config"]
output-type = "static"

[package.package-configuration."cactor.api.public"]
output-type = "static"

[package.package-configuration."cactor.api.extensions"]
output-type = "static"

# === Patterns Layer ===
[package.package-configuration."cactor.patterns.ask"]
output-type = "static"

# === Integration Tests ===
[package.package-configuration."cactor.integration.testing.plan10_comprehensive_test"]
output-type = "executable"

[package.package-configuration."cactor.integration.testing.simple_plan10_test"]
output-type = "executable"

[package.package-configuration."cactor.integration.testing.plan10_cactor_runtime_test"]
output-type = "executable"

[package.package-configuration."cactor.integration.testing.plan10_api_test"]
output-type = "executable"

[package.package-configuration."cactor.integration.testing.plan10_actorcontext_test"]
output-type = "executable"

[package.package-configuration."cactor.integration.testing.plan10_router_test"]
output-type = "executable"

[package.package-configuration."cactor.integration.testing.unified_cactor_system_test"]
output-type = "executable"

[package.package-configuration."cactor.examples.advanced_mailbox_examples"]
output-type = "executable"

[package.package-configuration."cactor.examples.advanced_dispatcher_examples"]
output-type = "executable"

[package.package-configuration."cactor.examples.configuration_usage_test"]
output-type = "executable"

[package.package-configuration."cactor.integration.testing.simple_benchmark_test"]
output-type = "executable"

[package.package-configuration."cactor.examples.benchmark_demo"]
output-type = "executable"

[package.package-configuration."cactor.examples.typed_actor_demo"]
output-type = "executable"

[package.package-configuration."cactor.examples.enhanced_typed_actor_demo"]
output-type = "executable"

[package.package-configuration."cactor.integration.testing.enhanced_dispatcher_test"]
output-type = "executable"

[package.package-configuration."cactor.integration.testing.plan10_advanced_supervision_test"]
output-type = "executable"

# === Macro Tests ===
[package.package-configuration."cactor.examples.macro_test_demo"]
output-type = "executable"

[package.package-configuration."cactor.examples.comprehensive_macro_test"]
output-type = "executable"

[package.package-configuration."cactor.examples.real_macro_test"]
output-type = "executable"

[package.package-configuration."cactor.examples.enhanced_actor_test"]
output-type = "executable"

[package.package-configuration."cactor.examples.true_actor_macro_test"]
output-type = "executable"

[package.package-configuration."cactor.examples.typed_actor_test"]
output-type = "executable"

[package.package-configuration."cactor.examples.comprehensive_improvement_test"]
output-type = "executable"

# === Macros Package ===
[package.package-configuration."cactor.macros"]
output-type = "dynamic"

[package.package-configuration."cactor.integration.testing.simple_realistic_benchmark"]
output-type = "executable"

[target.aarch64-apple-darwin]
    compile-option = "--cfg \"ohos=false\""
    [target.aarch64-apple-darwin.bin-dependencies]
      path-option = [ "${AARCH64_MACOS_LIBS}", "${AARCH64_MACOS_MACRO_LIBS}", "/Users/louloulin/Documents/linchong/cj/CangjieSDK-Darwin/darwin_aarch64_llvm/static/stdx" ]
